  if (f.user) l.push(`    User ${f.user}`);
  if (f.key) l.push(`    IdentityFile ${f.key}`);
  f.other.split('\n').filter(x => x.trim()).forEach(x => l.push('    ' + x.trim()));

}
function sidecar(f) {
  const o = f.kind === 'ssh'
    ? { folder: f.folder, colour: f.colour || undefined, credential: f.cred ? { provider: f.cred.p, entry: f.cred.title ? `${f.cred.db}/<uuid>` : f.cred.entry, kind: f.cred.kind } : undefined }

function launchLine(f) {

  const cd = f.cwd ? `   (in ${f.cwd})` : '';
  if (f.shell === 'cmd') return `cmd${f.cmd ? ` /c ${q(f.cmd)}` : ''}${cd}`;
  if (f.shell === 'pwsh' || f.shell === 'powershell') return `${f.shell}${f.cmd ? ` -Command ${q(f.cmd)}` : ''}${cd}`;
  return `${f.shell} -l${f.cmd ? `c ${q(f.cmd)}` : ''}${cd}`;
}

// ---------- Test ----------
function makeSteps(f) {
  const user = f.user || ME, target = `${f.host || f.alias}:${f.port || 22}`;
  return [
    { id: 'resolve', label: `Resolved with ssh -G ${f.alias}`, detail: `${user}@${target}` },
    { id: 'reach', label: `Reached ${target}` },
    { id: 'key', label: 'Host key', detail: 'ED25519, matches known_hosts line 14' },
    { id: 'login', label: `Logged in as ${user}`, detail: f.cred ? `with ${credLabel(f.cred)}` : 'with a password for this test only' },
    { id: 'sftp', label: 'SFTP', detail: `opened /home/${user}` },
  ];
}
function stepResult(id, f, outcome, answered) {
  if (id === 'reach' && outcome === 'unreach') return { fail: 'Timed out after 10 s. Check Host name and Port.' };
  if (id === 'key' && outcome === 'changed') return { fail: 'The host key changed since known_hosts line 14. Open a Tab to compare and replace it.' };
  if (id === 'key' && outcome === 'newkey' && !answered) return { ask: 'key' };
  if (id === 'login') {
    if (tpmClash(f)) return { fail: `TPM #${f.cred.entry} has user name ${f.cred.tpmUser}, not ${f.user || ME}.` };
    if (!f.cred && !answered) return { ask: 'pw' };
    if (outcome === 'auth') return { fail: f.cred ? `Permission denied. The host refused the secret in ${credLabel(f.cred)}.` : 'Permission denied (password).' };
  }
  return 'ok';
}
function useTest(form, outcome) {
  const [t, setT] = useState(null);
  const timer = useRef();
  useEffect(() => () => clearTimeout(timer.current), []);
  const go = (steps, f, i, states) => {
    if (i >= steps.length) return setT({ steps, f, states, done: true });
    states = [...states]; states[i] = 'run';
    setT({ steps, f, states, i });
    timer.current = setTimeout(() => step(steps, f, i, states, false), 420);
  };
  const step = (steps, f, i, states, answered) => {
    const r = stepResult(steps[i].id, f, outcome, answered);
    states = [...states];
    if (r === 'ok') { states[i] = 'ok'; go(steps, f, i + 1, states); }
    else if (r.ask) { states[i] = 'ask'; setT({ steps, f, states, i, ask: r.ask }); }
    else { states[i] = 'fail'; setT({ steps, f, states, i, reason: r.fail, done: true }); }
  };
  return {
    t,
    run() { clearTimeout(timer.current); const steps = makeSteps(form); go(steps, form, 0, steps.map(() => 'wait')); },
    answer(ok) {
      const states = [...t.states];
      if (!ok) { states[t.i] = 'fail'; return setT({ ...t, states, ask: null, reason: 'Cancelled.', done: true }); }
      states[t.i] = 'run';
      setT({ ...t, states, ask: null });
      timer.current = setTimeout(() => step(t.steps, t.f, t.i, states, true), 420);
    },
    clear() { clearTimeout(timer.current); setT(null); },
  };
}
const ICON = { wait: '○', run: '●', ok: '✓', fail: '✕', ask: '?' };
function TestList({ test, empty }) {
  const [pw, setPw] = useState('');
  const t = test.t;
  if (!t) return empty ? html`<div className="checklist muted">${empty}</div>` : null;
  return html`<div className="checklist">
    ${t.steps.map((s, i) => html`<div key=${s.id} className=${'step ' + t.states[i]}>
      <span className="ic">${ICON[t.states[i]]}</span>${s.label}${s.detail && t.states[i] === 'ok' && html`<span className="muted"> · ${s.detail}</span>`}
      ${t.states[i] === 'fail' && html`<div className="reason">${t.reason}</div>`}
      ${t.states[i] === 'ask' && t.ask === 'key' && html`<div className="ask">
        <div>First connection to ${t.f.host || t.f.alias}. Its ED25519 key fingerprint is <code>SHA256:Zt8wq1…k2Q</code>. Trust saves it to known_hosts.</div>
        <div className="hrow"><button className="primary" onClick=${() => test.answer(true)}>Trust</button><button onClick=${() => test.answer(false)}>Cancel</button></div>
      </div>`}
      ${t.states[i] === 'ask' && t.ask === 'pw' && html`<div className="ask">
        <div>No secret attached. Password for ${t.f.user || ME}@${t.f.host || t.f.alias}, used for this test only:</div>

          <button className="primary" onClick=${() => test.answer(true)}>Log in</button><button onClick=${() => test.answer(false)}>Cancel</button></div>

    </div>`)}

  </div>`;
}

// ---------- variant G: type or paste one ssh command ----------
function parseCmd(text) {
  const toks = (text.match(/"[^"]*"|'[^']*'|\S+/g) || []).map(t => t.replace(/^(["'])(.*)\1$/, '$2'));
  const f = { host: '', port: '', user: '', key: '' }, opts = [], rows = [];
  let dest = false;
  if (toks[0] === 'ssh') toks.shift();
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i], next = () => toks[++i] || '';
    if (t === '-p') { const v = next(); f.port = v; rows.push(/^\d+$/.test(v) ? [`-p ${v}`, `Port ${v}`, 'Port to connect to'] : [`-p ${v}`, 'Port must be a number', '', 'bad']); }
    else if (t === '-i') { const v = next(); f.key = v; rows.push([`-i ${v}`, `IdentityFile ${v}`, 'Key file to log in with']); }
    else if (t === '-l') { const v = next(); f.user = v; rows.push([`-l ${v}`, `User ${v}`, 'User to log in as']); }
    else if (t === '-o' || t.startsWith('-o')) {
      const v = t === '-o' ? next() : t.slice(2);
      const line = v.replace(/^(\w+)\s*=\s*/, '$1 ');
      opts.push(line); rows.push([`-o ${v}`, line, hint(line) || '']);
    }
    else if (t === '-A') { opts.push('ForwardAgent yes'); rows.push(['-A', 'ForwardAgent yes', HINTS.forwardagent]); }
    else if (t === '-C') { opts.push('Compression yes'); rows.push(['-C', 'Compression yes', HINTS.compression]); }
    else if (t === '-J') { const v = next(); opts.push(`ProxyJump ${v}`); rows.push([`-J ${v}`, `ProxyJump ${v}`, HINTS.proxyjump, 'warn']); }
    else if (/^-[LRD]$/.test(t)) { const v = next(); rows.push([`${t} ${v}`, "Port forwarding isn't in v1", '', 'bad']); }
    else if (t.startsWith('-')) rows.push([t, `Unknown or unsupported flag ${t}`, '', 'bad']);
    else if (!dest) {
      dest = true;
      const at = t.lastIndexOf('@');
      if (at > 0) { f.user = t.slice(0, at); f.host = t.slice(at + 1); rows.push([t, `User ${f.user}, HostName ${f.host}`, 'Who and where']); }
      else { f.host = t; rows.push([t, `HostName ${t}`, 'Where to connect']); }
    }
    else rows.push([t, 'A remote command. Saved sessions don\'t store one.', '', 'bad']);
  }
  return { fields: { ...f, other: opts.join('\n') }, rows };
}
function VarG({ form, set, ctx, test, opt }) {

    <${Row} l="Command">

      <div className="note">Type or paste an ssh command. Empty parts use what <code>ssh -G</code> gives: port 22, user ${ME}.</div>
      <table className="parsed mono"><tbody>

      </tbody></table>
      ${opt.map(o => html`<div key=${o.line} className=${'msg ' + (o.err ? 'bad' : 'warn')}>${optLines(form)[o.line - 1] || ''}: ${o.err || o.warn}</div>`)}

}

const VARIANTS = {

// ---------- dialogs ----------
function Modal({ title, width, height, onClose, foot, children }) {
  useEffect(() => {
    const k = e => e.key === 'Escape' && !document.querySelector('.pop') && onClose();
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [onClose]);
  return html`<div className="overlay">
    <div className="modal" style=${{ width, height }} role="dialog">
      <div className="mhead"><span>${title}</span><button className="x" onClick=${onClose}>✕</button></div>
      <div className="mbody">${children}</div>
      ${foot}
    </div>
  </div>`;
}

function SessionDialog({ init, mode, variant, ctx, outcome, onClose, onSave }) {
  const [form, setForm] = useState(init);
  const set = patch => setForm(f => ({ ...f, ...patch }));
  const test = useTest(form, outcome);
  const fctx = { ...ctx, original: mode === 'edit' ? init : null };
  const opt = form.kind === 'ssh' ? parseOther(form.other) : [];
  const canSave = !aliasError(form.alias, fctx) && !opt.some(o => o.err);
  const title = mode === 'edit' ? html`Edit ${init.alias} <span className="muted small">${init.kind === 'ssh' ? 'SSH session' : 'local shell session'}</span>`
    : form.kind === 'ssh' ? 'New SSH session' : 'New local shell session';
  const foot = html`<div className="foot">
    ${form.kind === 'ssh' && html`<button onClick=${test.run} disabled=${!form.alias}>Test</button>`}
    <span className="grow"></span>
    <button onClick=${onClose}>Cancel</button>
    <button className="primary" disabled=${!canSave} onClick=${() => onSave(form, mode === 'edit' ? init : null)}>Save</button>
  </div>`;
  if (form.kind === 'local')
    return html`<${Modal} title=${title} width=${460} onClose=${onClose} foot=${foot}><${LocalForm} form=${form} set=${set} ctx=${fctx}/><//>`;
  const V = VARIANTS[variant];
  return html`<${Modal} title=${title} width=${V.width} onClose=${onClose} foot=${foot}><${V.C} form=${form} set=${set} ctx=${fctx} test=${test} opt=${opt}/><//>`;
}

function MovePicker({ name, current, exclude, folders, onPick, onClose }) {
  const [q, setQ] = useState('');
  const [i, setI] = useState(0);
  const list = ['', ...folders].filter(f => !(exclude && (f === exclude || f.startsWith(exclude + '/'))) && fname(f).toLowerCase().includes(q.toLowerCase()));
  const key = e => {
    if (e.key === 'ArrowDown') { setI(Math.min(i + 1, list.length - 1)); e.preventDefault(); }
    if (e.key === 'ArrowUp') { setI(Math.max(i - 1, 0)); e.preventDefault(); }
    if (e.key === 'Enter' && list[i] !== undefined) onPick(list[i]);
  };
  return html`<${Modal} title=${`Move ${name} to…`} width=${400} onClose=${onClose}>
    <input className="in" autoFocus placeholder="Type part of a folder name, then Enter" value=${q} onChange=${e => { setQ(e.target.value); setI(0); }} onKeyDown=${key}/>
    <div className="list" style=${{ marginTop: 8, maxHeight: 240 }}>
      ${list.map((f, j) => html`<div key=${f} className=${'li' + (j === i ? ' on' : '')} onMouseEnter=${() => setI(j)} onClick=${() => onPick(f)}>
        ${fname(f)}${f === current && html`<span className="muted small"> · current</span>`}</div>`)}
      ${!list.length && html`<div className="li muted">No folder matches</div>`}
    </div>
    <div className="note">↑ ↓ to choose, Enter to move, Esc to cancel.</div>
  <//>`;
}

function secretsInside(inside, sessions) {
  const outside = new Set(sessions.filter(s => !inside(s) && s.cred).map(s => credKey(s.cred)));
  const m = new Map();
  sessions.filter(s => inside(s) && s.cred && s.cred.p !== 'TPM' && !outside.has(credKey(s.cred))).forEach(s => m.set(credKey(s.cred), s.cred));
  return [...m.values()];
}
function ConfirmDelete({ title, lines, secrets, onConfirm, onClose }) {
  const [del, setDel] = useState(false);
  const cancel = useRef();
  useEffect(() => cancel.current && cancel.current.focus(), []);
  const provs = [...new Set(secrets.map(c => c.p === 'Keychain' ? 'keychain' : 'KeePass'))].join(' / ');
  return html`<${Modal} title="Delete" width=${440} onClose=${onClose} foot=${html`<div className="foot"><span className="grow"></span>
      <button ref=${cancel} onClick=${onClose}>Cancel</button><button className="danger" onClick=${() => onConfirm(del)}>Delete</button></div>`}>
    <div className="stack">
      <div style=${{ fontSize: 14 }}>${title}</div>
      ${lines.map((l, i) => html`<div key=${i} className="muted">${l}</div>`)}
      ${secrets.length > 0 && html`<label className="check"><input type="checkbox" checked=${del} onChange=${e => setDel(e.target.checked)}/>
        Also delete ${plural(secrets.length, 'saved secret')} from ${provs}</label>`}
      ${del && secrets.some(c => c.p === 'KeePass') && html`<div className="note">KeePass work is locked. Delete asks for its master password first.</div>`}
    </div>
  <//>`;
}

// ---------- app ----------
function App() {
  const qv = new URLSearchParams(location.search).get('variant');
  const [variant, setVariantRaw] = useState(VKEYS.includes(qv) ? qv : 'E');
  const [outcome, setOutcome] = useState('ok');
  const [theme, setTheme] = useState(matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const [sessions, setSessions] = useState(SESSIONS0);
  const [folders, setFolders] = useState(FOLDERS0);
  const [hand, setHand] = useState(HAND0);
  const [orphans, setOrphans] = useState([]);
  const [dlg, setDlg] = useState(null);
  const [menu, setMenu] = useState(null);
  const [toast, setToast] = useState(null);
  const [sel, setSel] = useState({ t: 's', id: 'web1' });
  const [collapsed, setCollapsed] = useState(new Set());
  const [renaming, setRenaming] = useState(null);
  const [filter, setFilter] = useState('');
  const dlgId = useRef(0);

  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  const setVariant = v => { setVariantRaw(v); history.replaceState(null, '', `?variant=${v}`); };
  const cycle = d => setVariant(VKEYS[(VKEYS.indexOf(variant) + d + VKEYS.length) % VKEYS.length]);
  useEffect(() => {
    const k = e => {
      if (e.target.closest('input, textarea, select, [contenteditable]')) return;
      if (e.key === 'ArrowLeft') cycle(-1);
      if (e.key === 'ArrowRight') cycle(1);
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  });
  useEffect(() => {
    const close = e => { if (!e.target.closest('.menu')) setMenu(null); };
    addEventListener('mousedown', close); return () => removeEventListener('mousedown', close);
  }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 9000); return () => clearTimeout(t); }, [toast]);

  const ctx = { sessions, folders, hand };
  const byAlias = a => sessions.find(s => s.alias === a);
  const open = d => { dlgId.current++; setMenu(null); setDlg({ ...d, id: dlgId.current }); };
  const selFolder = () => sel.t === 'f' ? sel.id : sel.t === 's' && byAlias(sel.id) ? byAlias(sel.id).folder : '';
  const nextFree = base => { let n = 2; while (sessions.some(s => s.alias === `${base}-${n}`)) n++; return `${base}-${n}`; };

  const act = {
    openTab: name => setToast({ title: `Opens a Tab on ${name}` }),
    edit: s => open({ type: 'session', mode: 'edit', init: s }),
    newSsh: folder => open({ type: 'session', mode: 'new', init: ssh({ alias: '', folder, other: NEW_SESSION_OPTIONS }) }),
    newLocal: folder => open({ type: 'session', mode: 'new', init: local({ alias: '', folder }) }),
    duplicate: s => open({ type: 'session', mode: 'new', init: { ...s, alias: nextFree(s.alias), tabs: [] } }),
    move: s => open({ type: 'move', name: s.alias, current: s.folder, onPick: f => { setSessions(ss => ss.map(x => x === s ? { ...x, folder: f } : x)); setDlg(null); } }),
    moveFolder: p => open({ type: 'move', name: last(p), current: parentOf(p), exclude: p, onPick: f => {
      const np = f ? `${f}/${last(p)}` : last(p);
      if (folders.some(x => x.toLowerCase() === np.toLowerCase())) return setToast({ title: `${fname(f)} already has a folder named ${last(p)}` });
      renameFolder(p, np); setDlg(null);
    } }),
    del: s => {
      const secrets = secretsInside(x => x === s, sessions);
      const sharers = s.cred ? sessions.filter(x => x !== s && x.cred && credKey(x.cred) === credKey(s.cred)).map(x => x.alias) : [];
      open({ type: 'delete', title: html`Delete <b className="mono">${s.alias}</b>?`, secrets, lines: [
        s.tabs.length && `${plural(s.tabs.length, 'Tab')} ${s.tabs.length === 1 ? 'is' : 'are'} open. They stay open.`,
        sharers.length && `${sharers.join(', ')} also use${sharers.length === 1 ? 's' : ''} its secret, so the secret stays.`,
        s.cred && s.cred.p === 'TPM' && 'Its TPM entry stays. The app never deletes from TPM.',
      ].filter(Boolean), onConfirm: () => {
        setSessions(ss => ss.filter(x => x !== s));
        if (s.tabs.length) setOrphans(o => [...o, ...s.tabs.map(t => [s.alias, t[0]])]);
        setDlg(null);
      } });
    },
    delFolder: p => {
      const inside = s => s.folder === p || s.folder.startsWith(p + '/');
      const subs = folders.filter(f => f.startsWith(p + '/')).length;
      const ss = sessions.filter(inside);
      const tabs = ss.reduce((n, s) => n + s.tabs.length, 0);
      const doIt = () => {
        setFolders(fs => fs.filter(f => f !== p && !f.startsWith(p + '/')));
        setSessions(all => all.filter(s => !inside(s)));
        setOrphans(o => [...o, ...ss.flatMap(s => s.tabs.map(t => [s.alias, t[0]]))]);
        setDlg(null);
      };
      if (!subs && !ss.length) { doIt(); return setToast({ title: `Deleted empty folder ${last(p)}`, body: 'An empty folder goes without asking.' }); }
      const parts = [subs && plural(subs, 'subfolder'), ss.length && plural(ss.length, 'Saved session')].filter(Boolean).join(' and ');
      open({ type: 'delete', title: html`Delete folder <b className="mono">${last(p)}</b>, ${parts}?`, secrets: secretsInside(inside, sessions),
        lines: [tabs && `${plural(tabs, 'Tab')} ${tabs === 1 ? 'is' : 'are'} open. They stay open and move to Unsaved.`].filter(Boolean), onConfirm: doIt });
    },
    newFolder: parent => { setMenu(null); setCollapsed(c => { const n = new Set(c); n.delete(parent); return n; }); setRenaming({ parent, path: null, value: '' }); },
    rename: p => { setMenu(null); setRenaming({ parent: parentOf(p), path: p, value: last(p) }); },
    moveIn: h => {
      setHand(hs => hs.filter(x => x !== h));
      setSessions(ss => [...ss, ssh({ alias: h, host: h === 'pi' ? '192.168.1.9' : '192.168.1.1', user: 'pi' })]);
      setToast({ title: `Moved ${h} into slop-term`, body: `Copied Host ${h} into ~/.ssh/slop-term.conf\nCommented out its block in ~/.ssh/config (line 30)` });
    },
  };
  function renameFolder(from, to) {
    setFolders(fs => fs.map(f => f === from ? to : f.startsWith(from + '/') ? to + f.slice(from.length) : f).sort());
    setSessions(ss => ss.map(s => s.folder === from ? { ...s, folder: to } : s.folder.startsWith(from + '/') ? { ...s, folder: to + s.folder.slice(from.length) } : s));
  }
  const renameError = r => {
    const v = r.value.trim();
    if (!v) return 'Name the folder';
    if (v.includes('/')) return 'No / in folder names';
    const full = r.parent ? `${r.parent}/${v}` : v;
    if (folders.some(f => f !== r.path && parentOf(f) === r.parent && last(f).toLowerCase() === v.toLowerCase())) return `${fname(r.parent)} already has ${last(full)}`;
    return null;
  };
  const commitRename = () => {
    const r = renaming; if (!r) return;
    if (renameError(r)) { if (!r.path && !r.value.trim()) setRenaming(null); return; }
    const full = r.parent ? `${r.parent}/${r.value.trim()}` : r.value.trim();
    if (r.path) renameFolder(r.path, full); else setFolders(fs => [...fs, full].sort());
    setRenaming(null);
  };

  const sessionMenu = s => [
    ['Open Tab', 'Enter', () => act.openTab(s.alias)],
    ['Edit', 'F2', () => act.edit(s)],
    ['Duplicate', '', () => act.duplicate(s)],
    ['Move to…', 'F7', () => act.move(s)],
    s.dupLine && '-',
    s.dupLine && [`Comment out the copy in ~/.ssh/config`, '', () => setToast({ title: `Commented out Host ${s.alias} in ~/.ssh/config line ${s.dupLine}` })],
    '-',
    ['Delete', 'Del', () => act.del(s), true],
  ].filter(Boolean);
  const folderMenu = p => [
    ['New SSH session here', '', () => act.newSsh(p)],
    ['New local shell here', '', () => act.newLocal(p)],
    ['New folder here', '', () => act.newFolder(p)],
    '-',
    ['Rename', 'F2', () => act.rename(p)],
    ['Move to…', 'F7', () => act.moveFolder(p)],
    '-',
    ['Delete', 'Del', () => act.delFolder(p), true],
  ];
  const handMenu = h => [['Open Tab', 'Enter', () => act.openTab(h)], ['Move into slop-term', '', () => act.moveIn(h)]];
  const ctxMenu = (e, items, s) => { e.preventDefault(); setSel(s); setMenu({ x: e.clientX, y: e.clientY, items }); };

  const treeKey = e => {
    if (renaming || dlg) return;
    const s = sel.t === 's' && byAlias(sel.id);
    if (s) ({ Enter: () => act.openTab(s.alias), F2: () => act.edit(s), Delete: () => act.del(s), F7: () => act.move(s) }[e.key] || (() => {}))();
    if (sel.t === 'f') ({ F2: () => act.rename(sel.id), Delete: () => act.delFolder(sel.id), F7: () => act.moveFolder(sel.id) }[e.key] || (() => {}))();
    if (sel.t === 'h' && e.key === 'Enter') act.openTab(sel.id);
    if (['F2', 'F7', 'Delete'].includes(e.key)) e.preventDefault();
  };

  // ---- tree rows ----
  let tabNo = 0;
  const pad = d => ({ paddingLeft: 8 + d * 14 });
  const isSel = (t, id) => sel.t === t && sel.id === id ? ' sel' : '';
  const tabRows = (tabs, d) => tabs.map(([folder, title], i) => {
    tabNo++;
    return html`<div key=${i} className="tr" style=${pad(d)}><span className="lbl">${folder}${title && html`<span className="muted"> ${title}</span>`}</span>
      ${tabNo <= 9 && html`<span className="right"><span className="keycap" title=${`Ctrl+Shift+${tabNo}`}>${tabNo}</span></span>`}</div>`;
  });
  const sessionRow = (s, d) => {
    const missing = s.kind === 'local' && !SHELLS.some(x => x[0] === s.shell);
    return html`<${React.Fragment} key=${s.alias}>
      <div className=${'tr' + isSel('s', s.alias) + (missing ? ' dim' : '')} style=${pad(d)} onClick=${() => setSel({ t: 's', id: s.alias })}
        onDoubleClick=${() => act.openTab(s.alias)} onContextMenu=${e => ctxMenu(e, sessionMenu(s), { t: 's', id: s.alias })}>
        <span className="edge" style=${{ background: s.kind === 'ssh' ? 'var(--ssh)' : 'var(--local)' }}></span>
        ${s.colour && html`<span className="dot" style=${{ background: `var(--c-${s.colour})` }}></span>`}
        <span className="lbl">${s.alias}</span>
        <span className="right">
          ${s.dupLine && html`<span style=${{ color: 'var(--warn)' }} title=${`Also defined in ~/.ssh/config line ${s.dupLine}`}>⚠</span>`}
          ${missing ? html`<span className="muted small" title="not available on this machine">n/a</span>` : html`<span className="plus" title="Open another Tab">+</span>`}
        </span>
      </div>
      ${tabRows(s.tabs, d + 1)}
    <//>`;
  };
  const renameRow = (d, r) => html`<div key="rename" className="tr" style=${pad(d)}>
    <span className="chev">▾</span><span>📁</span>
    <input className=${'in' + (renameError(r) && r.value ? ' bad' : '')} autoFocus value=${r.value} title=${renameError(r) || ''}
      onFocus=${e => e.target.select()} onChange=${e => setRenaming({ ...r, value: e.target.value })} onBlur=${commitRename}
      onKeyDown=${e => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') setRenaming(null); e.stopPropagation(); }}/>
  </div>`;
  const folderRows = (parent, d) => {
    const subs = folders.filter(f => parentOf(f) === parent);
    const ss = sessions.filter(s => s.folder === parent).sort((a, b) => a.alias.localeCompare(b.alias));
    return [
      renaming && !renaming.path && renaming.parent === parent && renameRow(d, renaming),
      ...subs.map(f => {
        const shut = collapsed.has(f);
        if (renaming && renaming.path === f) return renameRow(d, renaming);
        return html`<${React.Fragment} key=${'f:' + f}>
          <div className=${'tr' + isSel('f', f)} style=${pad(d)} onClick=${() => setSel({ t: 'f', id: f })} onContextMenu=${e => ctxMenu(e, folderMenu(f), { t: 'f', id: f })}
            onDoubleClick=${() => setCollapsed(c => { const n = new Set(c); n.has(f) ? n.delete(f) : n.add(f); return n; })}>
            <span className="chev" onClick=${e => { e.stopPropagation(); setCollapsed(c => { const n = new Set(c); n.has(f) ? n.delete(f) : n.add(f); return n; }); }}>${shut ? '▸' : '▾'}</span>
            <span>📁</span><span className="lbl">${last(f)}</span>
          </div>
          ${!shut && folderRows(f, d + 1)}
        <//>`;
      }),
      ...ss.map(s => sessionRow(s, d)),
    ];
  };
  const fl = filter.toLowerCase();

  const scenes = {
    'Edit web1': () => act.edit(byAlias('web1')),
    'Edit db1 (TPM user clash)': () => act.edit(byAlias('db1')),
    'Edit legacy-box (7 options)': () => act.edit(byAlias('legacy-box')),
    'Edit ubuntu (local shell)': () => act.edit(byAlias('ubuntu')),
    'Edit mac-zsh (missing shell)': () => act.edit(byAlias('mac-zsh')),
    'New SSH session': () => act.newSsh(selFolder()),
    'New local shell': () => act.newLocal(selFolder()),
    'Duplicate web1': () => act.duplicate(byAlias('web1')),
    'Move web1 (F7)': () => act.move(byAlias('web1')),
    'Delete folder prod': () => act.delFolder('work/prod'),
    'Delete web1': () => act.del(byAlias('web1')),
  };

  return html`<div className="win">
    <div className="tree" tabIndex=${0} onKeyDown=${treeKey}>
      <div className="treetop">
        <input className="in" placeholder="Filter" value=${filter} onChange=${e => setFilter(e.target.value)}/>
        <button onClick=${e => { const r = e.currentTarget.getBoundingClientRect(); setMenu({ x: r.left, y: r.bottom + 4, items: [
          ['SSH session', '', () => act.newSsh(selFolder())], ['Local shell session', '', () => act.newLocal(selFolder())], ['Folder', '', () => act.newFolder(selFolder())]] }); }}>+ New</button>
      </div>
      <div className="rows">
        ${fl ? sessions.filter(s => s.alias.includes(fl)).map(s => sessionRow(s, 0)) : html`<${React.Fragment}>
          <div className="group">Unsaved</div>
          ${tabRows([['pwsh', 'Projects']], 0)}
          ${orphans.map(([a, f], i) => html`<div key=${'o' + i} className="tr" style=${pad(0)}><span className="lbl">${a}<span className="muted"> ${f} · deleted</span></span></div>`)}
          ${hand.map(h => html`<div key=${h} className=${'tr' + isSel('h', h)} style=${pad(0)} onClick=${() => setSel({ t: 'h', id: h })} onContextMenu=${e => ctxMenu(e, handMenu(h), { t: 'h', id: h })}>
            <span className="edge" style=${{ background: 'var(--ssh)' }}></span><span className="lbl">${h}</span>
            <span className="right muted" title="Hand-written host, read-only">🔒</span></div>`)}
          <div style=${{ height: 6 }}></div>
          ${folderRows('', 0)}
        <//>`}
      </div>
    </div>
    <div className="main">
      <div className="hbar">web1 · deploy@10.0.1.11</div>
      <div className="termrow">
        <pre className="term mono">${`deploy@web1:~/app$ git pull\nAlready up to date.\ndeploy@web1:~/app$ ▌`}</pre>
        <div className="strip"><span>▸</span><span>SFTP · web1</span></div>
      </div>
    </div>

    ${menu && html`<div className="menu" style=${{ left: menu.x, top: menu.y }}>
      ${menu.items.map((it, i) => it === '-' ? html`<div key=${i} className="msep"></div>`
        : html`<div key=${i} className=${'mi' + (it[3] ? ' danger' : '')} onClick=${() => { setMenu(null); it[2](); }}><span>${it[0]}</span><span className="k">${it[1]}</span></div>`)}
    </div>`}

    ${dlg && dlg.type === 'session' && html`<${SessionDialog} key=${dlg.id} init=${dlg.init} mode=${dlg.mode} variant=${variant}
      ctx=${ctx} outcome=${outcome} onClose=${() => setDlg(null)} onSave=${(f, orig) => {
        const { picked, ...clean } = f;
        setSessions(ss => orig ? ss.map(s => s.alias === orig.alias ? { ...clean, tabs: s.tabs } : s) : [...ss, { ...clean, tabs: [] }]);
        setDlg(null);
        setToast({ title: `Saved ${f.alias}`, body: (f.kind === 'ssh' ? `~/.ssh/slop-term.conf\n${hostBlock(f)}\n\n` : '') + `~/.ssh/slop-term.json\n${sidecar(f)}` });
      }}/>`}
    ${dlg && dlg.type === 'move' && html`<${MovePicker} key=${dlg.id} ...${dlg} folders=${folders} onClose=${() => setDlg(null)}/>`}
    ${dlg && dlg.type === 'delete' && html`<${ConfirmDelete} key=${dlg.id} ...${dlg} onClose=${() => setDlg(null)}/>`}

    ${toast && html`<div className="toast"><div className="hrow"><b className="grow">${toast.title}</b><button className="xs" onClick=${() => setToast(null)}>✕</button></div>
      ${toast.body && html`<pre className="mono">${toast.body}</pre>`}</div>`}

    <div className="switcher">
      <button onClick=${() => cycle(-1)}>←</button>
      <span className="v">${variant} · ${VARIANTS[variant].name}</span>
      <button onClick=${() => cycle(1)}>→</button>
      <span className="sep"></span>
      <span>Test:</span>
      <select value=${outcome} onChange=${e => setOutcome(e.target.value)}>
        <option value="ok">works</option><option value="newkey">unknown host key</option><option value="changed">changed host key</option>
        <option value="auth">login refused</option><option value="unreach">unreachable</option>
      </select>
      <span className="sep"></span>
      <select value="" onChange=${e => { const f = scenes[e.target.value]; if (f) f(); }}>
        <option value="">Open a scene…</option>${Object.keys(scenes).map(k => html`<option key=${k}>${k}</option>`)}
      </select>
      <button onClick=${() => setTheme(theme === 'dark' ? 'light' : 'dark')}>${theme === 'dark' ? 'Light' : 'Dark'}</button>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
