name: debug-win
on:
  push:
    branches: [debug/win-typed-ssh]
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        src: [fixed, main]
        run: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - if: matrix.src == 'main'
        shell: bash
        run: git fetch --depth=1 origin main && git checkout FETCH_HEAD -- src
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
